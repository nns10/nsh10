<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>능소화 🌺</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: #fff0f3;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-width: 500px;
            width: 100%;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 25px;
            border: 2px solid #fecdd3;
            box-shadow: 0 10px 25px rgba(244, 63, 94, 0.08);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: #e11d48;
            font-weight: bold;
        }

        .calendar-header button {
            background: #ffe4e6;
            border: none;
            color: #e11d48;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .calendar-header button:hover {
            background: #fecdd3;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .day-name {
            font-weight: bold;
            color: #fb7185;
            padding-bottom: 8px;
            font-size: 13px;
        }

        .day-name.sun { color: #f43f5e; }
        .day-name.sat { color: #818cf8; }

        .date-cell {
            position: relative;
            padding: 10px 0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #555;
            transition: all 0.2s;
        }

        .date-cell:hover:not(.empty) {
            background-color: #ffe4e6;
            color: #e11d48;
            font-weight: bold;
        }

        .date-cell.selected {
            background-color: #fda4af;
            color: white;
            font-weight: bold;
        }

        .date-cell.has-entry::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 3px;
            background-color: #fb7185;
            border-radius: 2px;
        }

        .date-cell.selected.has-entry::after {
            background-color: #ffffff;
        }

        .section-title {
            text-align: center;
            color: #e11d48;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #f43f5e;
            margin-bottom: 6px;
            font-size: 13px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #fecdd3;
            border-radius: 10px;
            background-color: #fff1f2;
            font-size: 13px;
            color: #333;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            border-color: #fda4af;
            background-color: #ffffff;
            box-shadow: 0 0 6px rgba(251, 113, 133, 0.25);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #fda4af;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #f43f5e;
        }

        .diary-item {
            background-color: #fff1f2;
            border: 1.5px solid #fecdd3;
            border-radius: 12px;
            padding: 18px;
            position: relative;
        }

        .diary-item-date {
            font-size: 12px;
            font-weight: bold;
            color: #fb7185;
            margin-bottom: 6px;
        }

        .diary-item-title {
            font-size: 16px;
            font-weight: bold;
            color: #e11d48;
            margin-bottom: 10px;
            padding-right: 80px;
        }

        .diary-item-content {
            font-size: 14px;
            color: #444;
            white-space: pre-wrap;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .book-section {
            background-color: #ffe4e6;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            border: 1px solid #fecdd3;
        }

        .book-title-text {
            font-weight: bold;
            color: #f43f5e;
            margin-bottom: 4px;
        }

        .book-content-text {
            color: #666;
            white-space: pre-wrap;
        }

        .action-btns {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: color 0.2s;
        }

        .edit-btn { color: #fb7185; }
        .edit-btn:hover { color: #e11d48; }
        .delete-btn { color: #fda4af; }
        .delete-btn:hover { color: #f43f5e; }

        .no-data {
            text-align: center;
            color: #fda4af;
            font-size: 14px;
            padding: 10px 0;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 15px;
        }

        .page-btn {
            background-color: #ffe4e6;
            border: none;
            color: #e11d48;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .page-num {
            font-size: 14px;
            color: #f43f5e;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="card">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">이전</button>
            <h2 id="monthYearTitle"></h2>
            <button onclick="changeMonth(1)">다음</button>
        </div>
        <div class="calendar-grid" id="calendarGrid">
            <div class="day-name sun">일</div>
            <div class="day-name">월</div>
            <div class="day-name">화</div>
            <div class="day-name">수</div>
            <div class="day-name">목</div>
            <div class="day-name">금</div>
            <div class="day-name sat">토</div>
        </div>
    </div>

    <div class="card">
        <h2 class="section-title">🌺 능소화 🌺</h2>

        <form id="diaryForm" onsubmit="saveDiary(event)">
            <input type="hidden" id="edit-id">
            
            <div class="form-group">
                <label for="diary-title">일기 제목</label>
                <input type="text" id="diary-title" required>
            </div>

            <div class="form-group">
                <label for="diary-content">일기 내용</label>
                <textarea id="diary-content" required></textarea>
            </div>

            <div class="form-group">
                <label for="book-title">책 제목</label>
                <input type="text" id="book-title">
            </div>

            <div class="form-group">
                <label for="book-content">책 내용</label>
                <textarea id="book-content"></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn-text">저장</button>
        </form>
    </div>

    <div class="card">
        <div id="allDiaryList"></div>
        <div class="pagination" id="paginationControls"></div>
    </div>
</div>

<!-- Firebase SDK 연결 -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 발급받으신 Firebase 키 연결 완료
    const firebaseConfig = {
        apiKey: "AIzaSyDjEP9n9CjIgxqmJM3SkE4epQvmeQ8U4XA",
        authDomain: "nsh10-83cd5.firebaseapp.com",
        databaseURL: "https://nsh10-83cd5-default-rtdb.firebaseio.com",
        projectId: "nsh10-83cd5",
        storageBucket: "nsh10-83cd5.firebasestorage.app",
        messagingSenderId: "1015774080794",
        appId: "1:1015774080794:web:296d6153177eac0bff06a3",
        measurementId: "G-4YHRV7KVHR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const diariesRef = ref(db, 'diaries');

    let currentDate = new Date();
    let selectedDateStr = null;
    let currentPage = 1;
    let diaryList = [];

    // 데이터가 변경되면 실시간으로 수신받는 리스너
    onValue(diariesRef, (snapshot) => {
        const data = snapshot.val();
        diaryList = [];
        if (data) {
            Object.keys(data).forEach(key => {
                diaryList.push({
                    id: key,
                    ...data[key]
                });
            });
            // 생성순 정렬 (최신글 우선)
            diaryList.sort((a, b) => b.createdAt - a.createdAt);
        }
        renderCalendar();
        renderFilteredDiaryList();
    });

    window.renderCalendar = function() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        document.getElementById('monthYearTitle').innerText = `${year}년 ${month + 1}월`;

        const firstDay = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();
        const grid = document.getElementById('calendarGrid');
        
        const cells = grid.querySelectorAll('.date-cell');
        cells.forEach(cell => cell.remove());

        for (let i = 0; i < firstDay; i++) {
            const emptyDiv = document.createElement('div');
            emptyDiv.classList.add('date-cell', 'empty');
            grid.appendChild(emptyDiv);
        }

        for (let day = 1; day <= lastDate; day++) {
            const dateDiv = document.createElement('div');
            dateDiv.classList.add('date-cell');
            dateDiv.innerText = day;

            const formattedMonth = String(month + 1).padStart(2, '0');
            const formattedDay = String(day).padStart(2, '0');
            const dateKey = `${year}-${formattedMonth}-${formattedDay}`;

            const hasEntry = diaryList.some(entry => entry.date === dateKey);
            if (hasEntry) {
                dateDiv.classList.add('has-entry');
            }

            if (selectedDateStr === dateKey) {
                dateDiv.classList.add('selected');
            }

            dateDiv.onclick = function() {
                selectDate(dateKey);
            };

            grid.appendChild(dateDiv);
        }
    }

    window.selectDate = function(dateKey) {
        selectedDateStr = dateKey;
        currentPage = 1;
        renderCalendar();
        renderFilteredDiaryList();
    }

    window.changeMonth = function(delta) {
        currentDate.setMonth(currentDate.getMonth() + delta);
        renderCalendar();
    }

    window.saveDiary = function(event) {
        event.preventDefault();

        if (!selectedDateStr) {
            alert("달력에서 날짜를 먼저 선택해주세요!");
            return;
        }

        const editId = document.getElementById('edit-id').value;
        const title = document.getElementById('diary-title').value;
        const content = document.getElementById('diary-content').value;
        const bookTitle = document.getElementById('book-title').value;
        const bookContent = document.getElementById('book-content').value;

        if (editId) {
            const targetRef = ref(db, `diaries/${editId}`);
            update(targetRef, {
                title,
                content,
                bookTitle,
                bookContent
            }).then(() => alert("일기가 수정되었습니다!"));
        } else {
            const newRef = push(diariesRef);
            set(newRef, {
                date: selectedDateStr,
                title,
                content,
                bookTitle,
                bookContent,
                createdAt: Date.now()
            }).then(() => {
                currentPage = 1;
                alert("일기가 동기화 저장되었습니다!");
            });
        }
        resetForm();
    }

    window.deleteDiary = function(id) {
        if (confirm("정말 이 일기를 삭제하시겠습니까?")) {
            remove(ref(db, `diaries/${id}`));
        }
    }

    window.editDiary = function(id) {
        const entry = diaryList.find(e => e.id === id);
        if (!entry) return;

        selectedDateStr = entry.date;
        document.getElementById('edit-id').value = entry.id;
        document.getElementById('diary-title').value = entry.title || '';
        document.getElementById('diary-content').value = entry.content || '';
        document.getElementById('book-title').value = entry.bookTitle || '';
        document.getElementById('book-content').value = entry.bookContent || '';

        document.getElementById('submit-btn-text').innerText = '수정 완료';
        renderCalendar();

        document.getElementById('diaryForm').scrollIntoView({ behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('diaryForm').reset();
        document.getElementById('edit-id').value = '';
        document.getElementById('submit-btn-text').innerText = '저장';
    }

    window.renderFilteredDiaryList = function() {
        const listContainer = document.getElementById('allDiaryList');
        const paginationContainer = document.getElementById('paginationControls');
        listContainer.innerHTML = '';
        paginationContainer.innerHTML = '';

        if (!selectedDateStr) {
            listContainer.innerHTML = '<div class="no-data">달력에서 날짜를 클릭해 주세요.</div>';
            return;
        }

        const dayEntries = diaryList.filter(entry => entry.date === selectedDateStr);

        if (dayEntries.length === 0) {
            listContainer.innerHTML = `<div class="no-data">${selectedDateStr}에 작성된 일기가 없습니다.</div>`;
            return;
        }

        const totalPages = dayEntries.length;
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const entry = dayEntries[currentPage - 1];

        let bookHtml = '';
        if (entry.bookTitle || entry.bookContent) {
            bookHtml = `
                <div class="book-section">
                    ${entry.bookTitle ? `<div class="book-title-text">[책 제목] ${entry.bookTitle}</div>` : ''}
                    ${entry.bookContent ? `<div class="book-content-text">${entry.bookContent}</div>` : ''}
                </div>
            `;
        }

        const item = document.createElement('div');
        item.classList.add('diary-item');
        item.innerHTML = `
            <div class="action-btns">
                <button class="action-btn edit-btn" onclick="editDiary('${entry.id}')">수정</button>
                <button class="action-btn delete-btn" onclick="deleteDiary('${entry.id}')">삭제</button>
            </div>
            <div class="diary-item-date">${entry.date}</div>
            <div class="diary-item-title">${entry.title}</div>
            <div class="diary-item-content">${entry.content}</div>
            ${bookHtml}
        `;

        listContainer.appendChild(item);

        if (totalPages > 1) {
            const prevBtn = document.createElement('button');
            prevBtn.classList.add('page-btn');
            prevBtn.innerText = '이전';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => {
                currentPage--;
                renderFilteredDiaryList();
            };

            const pageInfo = document.createElement('span');
            pageInfo.classList.add('page-num');
            pageInfo.innerText = `${currentPage} / ${totalPages}`;

            const nextBtn = document.createElement('button');
            nextBtn.classList.add('page-btn');
            nextBtn.innerText = '다음';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => {
                currentPage++;
                renderFilteredDiaryList();
            };

            paginationContainer.appendChild(prevBtn);
            paginationContainer.appendChild(pageInfo);
            paginationContainer.appendChild(nextBtn);
        }
    }
</script>

</body>
</html>
